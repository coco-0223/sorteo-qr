<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sorteo Rocio Carnicería & Granja - Registro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1e293b;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 2px solid #ff7a00;
      border-radius: 28px;
      padding: 32px 24px 28px;
      box-shadow: 0 16px 36px -8px rgba(255, 122, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.05);
      position: relative;
      text-align: center;
    }

    .logo-container {
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
    }

    .brand-logo {
      width: 130px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.08));
    }

    .header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #64748b;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper svg {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 19px;
      height: 19px;
      stroke: #ff7a00;
      pointer-events: none;
      transition: stroke 0.2s;
    }

    input {
      width: 100%;
      background: #fff8f3;
      border: 1.5px solid #ff7a00;
      border-radius: 14px;
      padding: 14px 14px 14px 46px;
      color: #0f172a;
      font-size: 1rem;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      background: #ffffff;
      border-color: #e65c00;
      box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.2);
    }

    input::placeholder {
      color: #94a3b8;
    }

    button.btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #ff7a00 0%, #ff5500 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 10px 24px -4px rgba(255, 122, 0, 0.45);
      margin-top: 10px;
    }

    button.btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px -4px rgba(255, 122, 0, 0.55);
    }

    button.btn-submit:active:not(:disabled) {
      transform: translateY(1px);
    }

    button.btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Estado de éxito */
    .success-view {
      display: none;
      text-align: center;
      padding: 20px 8px 12px;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .success-icon {
      width: 72px;
      height: 72px;
      background: rgba(34, 197, 94, 0.12);
      border: 2px solid #22c55e;
      color: #22c55e;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .success-icon svg {
      width: 36px;
      height: 36px;
      stroke: #22c55e;
      stroke-width: 2.5;
    }

    .success-view h2 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .success-view p.subtitle {
      font-size: 0.95rem;
      color: #475569;
      line-height: 1.5;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 0.78rem;
      color: #94a3b8;
      text-align: center;
      font-weight: 500;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 14px 22px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      pointer-events: none;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-icon {
      color: #22c55e;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- LOGO ROCIO CARNICERIA -->
    <div class="logo-container">
      <img src="logo.png" alt="Rocio Carnicería y Granja" class="brand-logo" />
    </div>

    <!-- FORMULARIO -->
    <div id="formContainer">
      <div class="header">
        <h1>Sorteo Fin de Año</h1>
        <p class="subtitle">Completá tus datos para participar</p>
      </div>

      <form id="registroForm">
        <div class="form-group">
          <label for="nombre">Nombre y Apellido</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="nombre" 
              name="nombre" 
              placeholder="Ej: Juan Pérez" 
              required 
              autocomplete="name"
            />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </div>
        </div>

        <div class="form-group">
          <label for="telefono">Número de Teléfono</label>
          <div class="input-wrapper">
            <input 
              type="tel" 
              id="telefono" 
              name="telefono" 
              placeholder="Ej: 11 2345 6789" 
              required 
              autocomplete="tel"
            />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">
          <span id="btnText">Participar</span>
          <div id="btnSpinner" class="spinner"></div>
        </button>
      </form>
    </div>

    <!-- ESTADO DE ÉXITO -->
    <div id="successView" class="success-view">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <h2>¡Participación registrada!</h2>
      <p class="subtitle" style="margin-top: 8px;">Tus datos fueron cargados con éxito. ¡Muchas gracias por participar!</p>
    </div>

    <div class="footer-note">
      Rocío Carnicería & Granja • Registro oficial
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">
    <div class="toast-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <span>¡Carga enviada con éxito!</span>
  </div>

  <script>
    const form = document.getElementById("registroForm");
    const formContainer = document.getElementById("formContainer");
    const successView = document.getElementById("successView");
    const btnSubmit = document.getElementById("btnSubmit");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");
    const toast = document.getElementById("toast");

    const CACHE_KEY = "sorteo_user_submission_state";
    const MAX_SUBMISSIONS_PER_DAY = 3;

    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function isWithinAllowedHours() {
      const currentHour = new Date().getHours();
      // Permitido de 8:00 AM (8) a 7:59 PM (19), es decir [8, 20)
      return currentHour >= 8 && currentHour < 20;
    }

    function getSubmissionState() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return { date: getTodayString(), count: 0 };
        const data = JSON.parse(raw);
        if (data.date !== getTodayString()) {
          return { date: getTodayString(), count: 0 };
        }
        return data;
      } catch (e) {
        return { date: getTodayString(), count: 0 };
      }
    }

    function incrementSubmissionCount() {
      const state = getSubmissionState();
      state.count += 1;
      localStorage.setItem(CACHE_KEY, JSON.stringify(state));
    }

    function showToast() {
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const telefono = document.getElementById("telefono").value.trim();

      if (!nombre || !telefono) return;

      btnSubmit.disabled = true;
      btnText.style.display = "none";
      btnSpinner.style.display = "block";

      const state = getSubmissionState();
      const isAllowedHour = isWithinAllowedHours();
      const canSubmitToSheet = isAllowedHour && (state.count < MAX_SUBMISSIONS_PER_DAY);

      try {
        if (canSubmitToSheet) {
          // Envía a Google Sheets
          await fetch('/api/registro', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, telefono })
          });
          // Incrementa el contador en el almacenamiento local del dispositivo
          incrementSubmissionCount();
        } else {
          // Simula tiempo de red para que sea completamente transparente e indistinguible
          await new Promise(resolve => setTimeout(resolve, 600));
        }

        // Siempre muestra éxito total al usuario
        showToast();
        formContainer.style.display = "none";
        successView.style.display = "block";

      } catch (err) {
        // En caso de corte de conexión momentáneo, se muestra el toast y la pantalla de éxito igual para evitar sospechas
        showToast();
        formContainer.style.display = "none";
        successView.style.display = "block";
      } finally {
        btnSubmit.disabled = false;
        btnText.style.display = "block";
        btnSpinner.style.display = "none";
      }
    });
  </script>
</body>
</html>
